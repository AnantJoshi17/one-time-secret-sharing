# Alembic configuration.
#
# Note what is NOT here: sqlalchemy.url. Normally Alembic keeps the database
# URL in this file, but this file is committed to git and the URL contains a
# password. Instead, alembic/env.py reads it from our settings object (and so
# from the environment / .env file), which is the same URL the app uses. One
# source of truth, no credentials in the repository.

[alembic]
script_location = alembic
prepend_sys_path = .

# Name new migration files like 2026_09_19_1430-a1b2c3_add_teams.py, so the
# directory listing sorts chronologically. The default is just the revision
# hash, which tells you nothing at a glance.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
