# Render blueprint: describes the whole deployment in one file.
#
# You can either point Render at this file (New > Blueprint) or click the same
# settings in the dashboard by hand. The README walks through both.

services:
  - type: web
    name: secret-sharing-service
    runtime: python
    plan: free
    region: oregon

    # Migrations run here, as part of the build.
    #
    # Render has a dedicated preDeployCommand for this, which is the proper
    # place for migrations -- but it requires a paid instance type. On the
    # free plan, appending `alembic upgrade head` to the build command is the
    # working alternative. Environment variables are available during the
    # build, so DATABASE_URL resolves correctly.
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"

    # $PORT is assigned by Render -- do not hard-code 8000, and you must bind
    # to 0.0.0.0 rather than 127.0.0.1 or the health check cannot reach you.
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

    healthCheckPath: /health

    envVars:
      # Pulled automatically from the database defined at the bottom of this
      # file, so the URL never has to be copied by hand.
      - key: DATABASE_URL
        fromDatabase:
          name: secretshare-db
          property: connectionString

      # generateValue tells Render to invent a strong random value once and
      # keep it. Perfect for these two, which just need to be unguessable.
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CLEANUP_TOKEN
        generateValue: true

      # NOT generateValue. A Fernet key has a specific format (32 random bytes,
      # url-safe base64) and Render's random string is not a valid one -- the
      # app would refuse to start. `sync: false` means "prompt me for this in
      # the dashboard", so you paste in a key you generated yourself:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: SECRET_ENCRYPTION_KEY
        sync: false

      # Set this to your real Render URL once you know it, so the share_url in
      # creation responses points somewhere real.
      - key: PUBLIC_BASE_URL
        sync: false

      - key: PYTHON_VERSION
        value: "3.13.1"

databases:
  - name: secretshare-db
    plan: free
    databaseName: secretshare
    user: secretshare
