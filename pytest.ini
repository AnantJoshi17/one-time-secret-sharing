[pytest]
testpaths = tests
# Show a short summary line for anything that is not a plain pass, and make
# assertion output verbose enough to debug from.
addopts = -v --tb=short
filterwarnings =
    # Starlette's TestClient triggers a deprecation warning from inside anyio.
    # It is not our code and there is nothing to fix on our side.
    ignore::DeprecationWarning:anyio.*
    ignore:.*BlockingPortal.*:DeprecationWarning
